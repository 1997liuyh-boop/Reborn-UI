packages:
  - "packages/*"
# docus 补丁:只改 AssistantLoading,让 AI 回答里「读取过的文档」条目可点击跳转(AppAssistantDrawer 在用)。
# 其余定制都在项目文件里:AI 面板 AppAssistantDrawer、app/app.vue、app/pages/[[lang]]/[...slug].vue、server/api/assistant.post.ts
# (pnpm v10 忽略 package.json 的 pnpm 字段,补丁配置必须放这里才能在 CI 全新安装时生效)
patchedDependencies:
  docus: patches/docus.patch
# 同上:overrides 也必须放这里,package.json 的 pnpm.overrides 在 pnpm v10 下不生效
overrides:
  "@nuxt/content": ^3.11.0
  zod: ^3.23.8
  zod-to-json-schema: ^3.23.5
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@tailwindcss/oxide"
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi
