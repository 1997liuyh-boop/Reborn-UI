# GitHub Actions 自动部署配置
# 功能：push 到 main 分支时自动构建 Nuxt 应用并部署到腾讯云服务器
# 与 .cnb.yml 的 CNB 流水线保持同构；敏感信息全部来自仓库的 Actions Secrets：
#   DEPLOY_SERVER_IP / DEPLOY_SERVER_USER / DEPLOY_TARGET_PATH / DEPLOY_SSH_PRIVATE_KEY
#   NUXT_AI_PROVIDER_API_KEY / NUXT_AI_PROVIDER_BASE_URL / NUXT_SESSION_PASSWORD
#   NUXT_FEISHU_APP_ID / NUXT_FEISHU_APP_SECRET
#   （配置入口：GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret）
name: deploy-to-tencent-cloud

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

# 同一时间只跑一次部署；新的 push 排队等待，绝不打断进行中的部署。
# 严禁改回 cancel-in-progress: true——「同步产物」与「重启进程」必须作为一个整体走完。
# 一旦在两者之间被掐断，磁盘上是新构建、pm2 里还是旧 server bundle，
# Nitro 会用旧清单的 Content-Length 去发新文件，首页直接 ERR_INCOMPLETE_CHUNKED_ENCODING。
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 直接读取 package.json 的 packageManager 字段安装 pnpm，
      # 规避 Node 20 自带 corepack 无法校验新版 pnpm 签名的问题（Cannot find matching keyid）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      # registry 与知识库生成物均不入库（见 .gitignore），必须在 Nuxt 构建前现生成：
      # modules/playground-completions.ts 要读 knowledge/components 产出 Playground 补全数据，
      # 该模块在目录缺失时只告警不报错，漏掉这一步会让线上补全静默消失且构建全绿。
      - name: 构建 registry 与知识库
        run: pnpm kb:bootstrap

      - name: 构建应用（uniapp H5 + Nuxt）
        # 构建 3000+ 模块内存开销大，默认 4GB 堆上限会 OOM；运行器 7GB 内存，6144MB 为安全值
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Docus AI 助手的构建期开关：构建时存在即启用助手 UI（非密钥，真实模型凭证在运行时注入）
          AI_GATEWAY_API_KEY: enabled
        run: pnpm run build

      - name: 部署到腾讯云服务器
        env:
          SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          SERVER_USER: ${{ secrets.DEPLOY_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_TARGET_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # ---- 运行时环境变量（生产环境 Nitro 不读 .env，必须经 pm2 进程环境注入）----
          NUXT_AI_PROVIDER_API_KEY: ${{ secrets.NUXT_AI_PROVIDER_API_KEY }}
          NUXT_AI_PROVIDER_BASE_URL: ${{ secrets.NUXT_AI_PROVIDER_BASE_URL }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_FEISHU_APP_ID: ${{ secrets.NUXT_FEISHU_APP_ID }}
          NUXT_FEISHU_APP_SECRET: ${{ secrets.NUXT_FEISHU_APP_SECRET }}
        run: |
          set -euo pipefail

          # 部署前先校验关键 Secrets 非空，避免 silent 空注入导致线上 AI 秒级空回复
          missing=0
          for key in SERVER_IP SERVER_USER DEPLOY_PATH SSH_PRIVATE_KEY \
            NUXT_AI_PROVIDER_API_KEY NUXT_AI_PROVIDER_BASE_URL NUXT_SESSION_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "❌ Secret/Env 缺失或为空: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "请到 GitHub 仓库 Settings → Secrets and variables → Actions 补齐上述 Secrets 后重跑。"
            exit 1
          fi

          # 配置 SSH 连接（私钥仅存在于本次运行的临时环境中）
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          # 第一趟同步：只增不删。
          # 这里刻意不带 --delete——整个 rsync 要跑几分钟，期间线上仍在服务旧 HTML，
          # 它引用的是旧的 _nuxt 哈希资源。若此刻就删旧文件，这几分钟内整站静态资源全 404。
          # 新旧资源哈希不同，可以安全共存，等重启完成后再由第二趟清理。
          # --exclude '.data'：AI 聊天 SQLite；--exclude 'ecosystem.config.cjs'：运行时密钥文件，
          # 二者都属于服务器本地状态，绝不能被第二趟的 --delete 清掉。
          rsync -avz \
            --exclude '.data' \
            --exclude 'ecosystem.config.cjs' \
            .output/ "$SERVER_USER@$SERVER_IP:$DEPLOY_PATH/"

          # 在 Actions runner 本地生成 ecosystem 文件，避免 ssh 双引号转义吞掉密钥特殊字符；
          # 再用 scp 落到服务器，pm2 startOrReload 保证 env 真正进入进程。
          python3 <<'PY'
          import json, os, re
          def normalize_base_url(raw: str) -> str:
              # openai-compatible SDK 会拼接 /chat/completions，必须带 /v1
              trimmed = raw.strip().rstrip("/")
              if not trimmed:
                  return trimmed
              if re.search(r"/v\d+[a-z]*$", trimmed, re.I):
                  return trimmed
              return trimmed + "/v1"
          base_url = normalize_base_url(os.environ["NUXT_AI_PROVIDER_BASE_URL"])
          env = {
              "NODE_ENV": "production",
              "NUXT_AI_PROVIDER_API_KEY": os.environ["NUXT_AI_PROVIDER_API_KEY"],
              "NUXT_AI_PROVIDER_BASE_URL": base_url,
              "NUXT_SESSION_PASSWORD": os.environ["NUXT_SESSION_PASSWORD"],
              "NUXT_FEISHU_APP_ID": os.environ.get("NUXT_FEISHU_APP_ID", ""),
              "NUXT_FEISHU_APP_SECRET": os.environ.get("NUXT_FEISHU_APP_SECRET", ""),
          }
          eco = {
              "apps": [{
                  "name": "index",
                  "script": "server/index.mjs",
                  "cwd": os.environ["DEPLOY_PATH"],
                  "instances": 1,
                  "exec_mode": "fork",
                  "env": env,
              }]
          }
          with open("/tmp/reborn-ecosystem.config.cjs", "w", encoding="utf-8") as f:
              f.write("module.exports = ")
              json.dump(eco, f, ensure_ascii=False, indent=2)
              f.write(";\n")
          print("ecosystem generated; ai baseUrl:", base_url)
          PY

          scp /tmp/reborn-ecosystem.config.cjs \
            "$SERVER_USER@$SERVER_IP:$DEPLOY_PATH/ecosystem.config.cjs"

          # 重启宝塔面板托管的 index 进程——nginx 将站点反代到它监听的 3000 端口。
          # 严禁再启动第二个进程（如旧方案的 re-ui）：会与 index 抢 3000 端口（EADDRINUSE）。
          ssh "$SERVER_USER@$SERVER_IP" "
            set -e
            cd '$DEPLOY_PATH'
            export PATH=\$PATH:/www/server/nodejs/v20.13.0/bin:/usr/local/bin
            chmod 600 ecosystem.config.cjs
            # delete + start 比 restart --update-env 更可靠：强制加载 ecosystem 内 env
            pm2 delete index >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs
            pm2 save
            pm2 show index | sed -n '1,40p'
          "

          # 第二趟同步：进程已经加载新 bundle，此时才回收上一版遗留的旧哈希资源。
          # 放在重启之后，是为了保证「旧资源可用」的窗口一直覆盖到切换完成为止。
          rsync -avz --delete \
            --exclude '.data' \
            --exclude 'ecosystem.config.cjs' \
            .output/ "$SERVER_USER@$SERVER_IP:$DEPLOY_PATH/"

          echo "🎉 GitHub Actions 自动部署完成！"

      - name: 部署后探针（AI 运行时）
        env:
          SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          # 可选：一段已登录用户的 Cookie（如 nuxt-session=...）。配置后冒烟会真实调用模型；未配置则只验证鉴权拦截生效
          SMOKE_COOKIE: ${{ secrets.DEPLOY_SMOKE_COOKIE }}
        run: |
          set -euo pipefail
          # 等进程起来
          sleep 5

          echo "---- GET / 首页完整性 ----"
          # 2026-09-14 事故的直接症状：pm2 没加载新 bundle，Nitro 拿旧清单的 Content-Length
          # 去发新的 index.html，响应体提前断流，浏览器报 ERR_INCOMPLETE_CHUNKED_ENCODING。
          # curl 对这种「收到的字节数少于声明」会以 18(PARTIAL_FILE) 退出，正好当断言用。
          if ! curl -fsS --max-time 30 -o /tmp/deploy-home.html "http://${SERVER_IP}/"; then
            echo "❌ 首页响应不完整：Content-Length 与实际字节数不符。"
            echo "   多半是产物已同步但 pm2 进程仍是旧 server bundle，去服务器重启 index 进程。"
            exit 1
          fi
          # 再确认文档确实闭合——防止 SSR 中途抛错却仍返回 200 的情况被放过
          tail -c 32 /tmp/deploy-home.html | grep -q '</html>' || {
            echo "❌ 首页 HTML 未正常闭合，SSR 可能中途抛错"; exit 1; }
          echo "首页完整性 ok（$(wc -c < /tmp/deploy-home.html) 字节）"

          echo "---- GET / 首页内容正确性 ----"
          # 上面两条只验了「字节完整 + 标签闭合」，而全站是预渲染的：
          # 构建期若 landing 集合查空，app/pages/index.vue 会 throw 404，
          # Nuxt 把错误页当成 / 的产物写进 index.html —— 那同样是一份闭合的完整 HTML，还带 200。
          # 2026-09-14 线上「Page not found: / in collection landing」就是这么溜过去的。
          # 注意写成 if 而不是 `grep -q ... && { exit 1; }`：后者在健康路径下
          # grep 返回非零会让整个 && 复合命令非零，set -e 直接把脚本打死。
          if grep -q 'Page not found' /tmp/deploy-home.html; then
            echo "❌ 首页返回的是预渲染错误页（HTTP 200 但内容是 404）。"
            echo "   构建期 landing 集合为空，多半是 content 的 SQL dump 下载被截断或失败。"
            grep -o 'Page not found[^"<]\{0,80\}' /tmp/deploy-home.html | head -1
            exit 1
          fi
          # 正向断言：landing 分支特有的导航地标，文档页与错误页都不会有。
          grep -q '首页导航' /tmp/deploy-home.html || {
            echo "❌ 首页缺少 landing 页地标，渲染出的不是首页本体"; exit 1; }
          echo "首页内容 ok"

          echo "---- GET /api/ai/status ----"
          status="$(curl -fsS --max-time 20 "http://${SERVER_IP}/api/ai/status")"
          echo "$status"
          # 探针未登录时只回传 ok（hasApiKey 等明细字段仅登录可见）；
          # ok 本身即「密钥存在 + baseUrl 存在 + provider 已注册 + 路径带 /v1」的合取，断言它就够了
          echo "$status" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'

          payload='{"messages":[{"role":"user","parts":[{"type":"text","text":"只回复：你好"}]}]}'

          echo "---- POST /__docus__/assistant 封禁回归 ----"
          # Docus 自带的助手处理器不鉴权也不限流，是个可被直接 POST 的免费 token 入口，
          # 已由 server/middleware/ai-guard.ts 封死返回 410。这里断言它一直是封死的：
          # 若某次 docus 升级重新注册了该路径而中间件没兜住，这条会先红。
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "http://${SERVER_IP}/__docus__/assistant" \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            --data "$payload")"
          echo "HTTP $code"
          [ "$code" = "410" ] || { echo "❌ 旧助手端点应为 410(已封禁)，实际 $code"; exit 1; }
          echo "旧端点封禁 ok"

          echo "---- POST /api/assistant smoke ----"
          if [ -z "${SMOKE_COOKIE:-}" ]; then
            # 未登录不会返回 401：登录校验在处理器内部，以「正常助手回复」的形式告知用户
            # （理由见 server/api/assistant.post.ts 头部注释），因此这里期望 200 + SSE 文本流。
            # 断言 200 与 text-delta 同时成立，可证明进程在线、路由存在、流式响应正常，
            # 且未登录分支不会打到模型（不消耗网关 token）。
            resp="$(curl -sS --max-time 60 -w '\n%{http_code}' -X POST "http://${SERVER_IP}/api/assistant" \
              -H "Content-Type: application/json" \
              -H "Accept: text/event-stream" \
              --data "$payload")"
            code="$(printf '%s' "$resp" | tail -n1)"
            body="$(printf '%s' "$resp" | sed '$d')"
            echo "HTTP $code（未提供 DEPLOY_SMOKE_COOKIE，仅校验未登录回复链路）"
            printf '%s' "$body" | head -c 400
            echo
            [ "$code" = "200" ] || { echo "❌ 期望 200，实际 $code"; exit 1; }
            printf '%s' "$body" | grep -q 'text-delta' || {
              echo "❌ 未登录回复里没有 text-delta，助手链路可能没起来"; exit 1; }
            echo "assistant 未登录回复 ok"
            exit 0
          fi

          body="$(curl -fsS --max-time 90 -X POST "http://${SERVER_IP}/api/assistant" \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -H "Cookie: ${SMOKE_COOKIE}" \
            --data "$payload")"
          echo "$body" | head -c 800
          echo
          # 至少应出现 reasoning 或 text；不允许再出现秒级空 finish(other)
          echo "$body" | python3 -c '
          import sys
          t=sys.stdin.read()
          assert "text-delta" in t or "reasoning-delta" in t, "assistant 仍无模型输出: "+t[:500]
          assert not (t.count("finish-step")>=1 and "reasoning-delta" not in t and "text-delta" not in t and "finishReason\":\"other\"" in t), t[:500]
          print("assistant smoke ok")
          '
