name: Build and Package

# main 分支的构建与部署由 deploy.yml 负责，此流水线仅为开发分支打包产物，避免重复构建。
# 分支名不在下列前缀内时，可在 Actions 页面用 workflow_dispatch 手动指定分支跑一次。
on:
  push:
    branches:
      - "feature/**"
      - "feature-*"
      - "refactor/**"
      - "fix/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不再写 version，自动读取 package.json 的 packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # registry 与知识库生成物不入库，Nuxt 构建依赖 knowledge/components 产出 Playground
      # 补全数据，须先现生成（与 deploy.yml 保持一致）
      - name: Build knowledge base and registry
        run: pnpm kb:bootstrap

      - name: Build
        # 构建模块量大，默认 4GB 堆上限会 OOM，与 deploy.yml 保持一致
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run build

      - name: Package build output
        id: package
        shell: bash
        run: |
          # 1. 生成变量
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          FILENAME="${TIMESTAMP}-${SAFE_BRANCH}.tar.gz"

          # 2. 创建目录并打包
          mkdir -p build-artifacts
          tar -czf "build-artifacts/${FILENAME}" .output

          # 3. 【关键】将变量写入 GITHUB_OUTPUT 供后续步骤使用
          echo "artifact_name=${FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # 使用上面步骤输出的变量
          name: ${{ steps.package.outputs.artifact_name }}
          path: build-artifacts/${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
