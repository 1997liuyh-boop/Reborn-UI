# 知识库与 registry 一致性校验
# 功能：PR 与分支推送时确认 registry 与知识库都能从源码干净重建，
#       并抓出「新增/删除组件或改了元数据却没同步 knowledge/index.json」的脏提交
#
# 注意步骤顺序不可颠倒（两者互为上下游，见 .gitignore 的说明）：
#   registry:build --strict-kb 读入库的 knowledge/index.json 拿 title/description
#   kb:build 读刚生成的 registry.json 拿 npm dependencies
# 因此必须 registry:build → kb:build，即根脚本 pnpm kb:bootstrap 的顺序。
name: kb-and-registry-check

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "feature-*"
      - "refactor/**"
      - "fix/**"
  # 分支名不在上列前缀内时，可在 Actions 页面手动指定分支跑一次
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: registry 重建（产物不入库，此处即发布链路的预演）
        run: pnpm registry:build

      - name: registry 产物自检（两处一致 + 知识库元数据确实注入）
        run: |
          node -e "
            const fs = require('fs');
            const normalize = (s) => { const j = JSON.parse(s); j.generatedAt = ''; return JSON.stringify(j); };
            const paths = ['packages/cli/registry/registry.json', 'packages/module/registry/registry.json'];

            // 校验一：两处 registry 内容一致（module 包靠 --also-out 产出，不能与 CLI 侧脱节）
            if (normalize(fs.readFileSync(paths[0], 'utf8')) !== normalize(fs.readFileSync(paths[1], 'utf8'))) {
              console.error('两处 registry 内容不一致'); process.exit(1);
            }

            // 校验二：title/description 必须来自 knowledge/index.json
            // registry:build 带 --strict-kb，索引缺失会直接失败；这里再兜一层，
            // 防止索引存在但组件 id 对不上导致发出一份没有标题描述的 registry
            const reg = JSON.parse(fs.readFileSync(paths[0], 'utf8'));
            const items = reg.components || [];
            if (items.length === 0) { console.error('registry 为空'); process.exit(1); }
            const naked = items.filter((c) => !c.title || !c.description).map((c) => c.name);
            if (naked.length > 0) {
              console.error('以下组件缺少知识库元数据（title/description）：' + naked.join(', '));
              process.exit(1);
            }
            console.log('registry 自检通过：' + items.length + ' 个组件，元数据齐全');
          "

      - name: 知识库重建（生成物不入库，此处同为发布链路的预演）
        run: pnpm kb:build

      # 移出 components/ 后唯一还有增量价值的守卫。
      # 原理：scripts/kb/build.ts 的 writeJsonStable() 在「除 generatedAt 外内容未变」时
      # 根本不写文件，所以内容真没变时 diff 必然干净；一旦有人新增/删除组件、或改了
      # title/description/category/tags 却没提交 index.json，这里就会红。
      # （kb:check 内部那条 index 一致性检查在 CI 中已恒真——index.json 刚被上一步就地更新过）
      - name: knowledge/index.json 必须已同步提交
        run: |
          if ! git diff --exit-code knowledge/index.json; then
            echo "❌ knowledge/index.json 与源码不同步"
            echo "   请在本地运行 pnpm kb:bootstrap，并提交更新后的 knowledge/index.json"
            exit 1
          fi

      - name: 知识库校验（schema / 集合一致性 / overrides 悬空引用）
        run: pnpm kb:check
