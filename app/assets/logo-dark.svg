<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Reborn UI 符号（卡片版·白色）</title>
  <desc>以UI卡片为载体的循环箭头符号，白色，透明背景。</desc>
  <!-- UI Card container -->
  <rect x="48" y="48" width="160" height="160" rx="24" ry="24" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <!-- Circular arrow inside card -->
  <circle cx="128" cy="128" r="52" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead -->
  <polygon points="168,98 154,108 160,92" fill="#FFFFFF" stroke="none"/>
  <!-- Inner dot -->
  <circle cx="128" cy="128" r="8" fill="#FFFFFF" stroke="none"/>
</svg>
