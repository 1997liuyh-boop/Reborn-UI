# .cnb.yml - 自动部署配置
# 功能：代码提交到main分支时自动构建并部署到腾讯云服务器

main:
  push:
    - name: "auto-deploy-on-main-push"
      runner:
        tags: cnb:arch:default
      env:
        # 服务器连接配置与 SSH 私钥全部来自 CNB 私有密钥仓库（见 imports），
        # 严禁在本文件或本仓库任何被跟踪文件中写明文密钥/IP/账号
        SERVER_IP: $DEPLOY_SERVER_IP
        SERVER_USER: $DEPLOY_SERVER_USER
        DEPLOY_PATH: $DEPLOY_TARGET_PATH
        SSH_PRIVATE_KEY: $DEPLOY_SSH_PRIVATE_KEY
      imports:
        # 私有密钥仓库：需在 CNB 上创建（建议名 secrets，仅授权本仓库 CI 读取），
        # 文件内容模板见本地 .cnb/secrets/deploy.yml（该文件已不入库）
        - https://cnb.cool/isLiuyinghao/secrets/-/blob/main/reborn-ui-deploy.yml
      stages:
        # 第一阶段：构建Nuxt.js应用
        - name: "build-stage"
          image: node:20
          script:
            - corepack enable
            - pnpm install --no-frozen-lockfile
            - pnpm run build
          artifacts:
            paths:
              - .output/
            expire_in: 1 hour
        
        # 第二阶段：部署到腾讯云服务器
        - name: "deploy-stage"
          image: alpine:latest
          script: |
            # 安装部署工具
            apk add --no-cache openssh-client rsync
            
            # 配置SSH连接
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
            
            # 同步构建产物到服务器
            rsync -avz --delete .output/ $SERVER_USER@$SERVER_IP:$DEPLOY_PATH/
            
            # 重启应用服务
            ssh $SERVER_USER@$SERVER_IP "
              cd $DEPLOY_PATH && 
              export PATH=$PATH:/www/server/nodejs/v20.13.0/bin:/usr/local/bin && 
              pm2 delete re-ui 2>/dev/null || true &&
              pm2 start server/index.mjs --name re-ui || npx pm2 start server/index.mjs --name re-ui
            "
            
            echo "🎉 自动部署完成！"
            echo "📍 服务器: $SERVER_IP"
            echo "🌿 分支: $CNB_BRANCH"
            echo "📝 提交: $CNB_COMMIT_SHORT"
            echo "⏰ 时间: $(date)"