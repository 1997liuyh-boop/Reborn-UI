# .cnb.yml - 自动部署配置
# 功能：代码提交到main分支时自动构建并部署到腾讯云服务器

main:
  push:
    - name: "auto-deploy-on-main-push"
      runner:
        tags: cnb:arch:default
      env:
        # 服务器连接配置
        SERVER_IP: "110.42.242.107"
        SERVER_USER: "root"
        DEPLOY_PATH: "/www/wwwroot/re-ui"
        # SSH私钥（从密钥仓库导入）
        SSH_PRIVATE_KEY: $DEPLOY_SSH_PRIVATE_KEY
      imports:
        # 引用密钥配置文件
        - .cnb/secrets/deploy.yml
      stages:
        # 第一阶段：构建Nuxt.js应用
        - name: "build-stage"
          image: node:20
          script:
            - corepack enable
            - pnpm install --no-frozen-lockfile
            - pnpm run build
          artifacts:
            paths:
              - .output/
            expire_in: 1 hour
        
        # 第二阶段：部署到腾讯云服务器
        - name: "deploy-stage"
          image: alpine:latest
          script: |
            # 安装部署工具
            apk add --no-cache openssh-client rsync
            
            # 配置SSH连接
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
            
            # 同步构建产物到服务器
            rsync -avz --delete .output/ $SERVER_USER@$SERVER_IP:$DEPLOY_PATH/
            
            # 重启应用服务
            ssh $SERVER_USER@$SERVER_IP "
              cd $DEPLOY_PATH && 
              export PATH=$PATH:/www/server/nodejs/v20.13.0/bin:/usr/local/bin && 
              pm2 delete re-ui 2>/dev/null || true &&
              pm2 start .output/server/index.mjs --name re-ui || npx pm2 start .output/server/index.mjs --name re-ui
            "
            
            echo "🎉 自动部署完成！"
            echo "📍 服务器: $SERVER_IP"
            echo "🌿 分支: $CNB_BRANCH"
            echo "📝 提交: $CNB_COMMIT_SHORT"
            echo "⏰ 时间: $(date)"